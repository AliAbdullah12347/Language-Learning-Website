<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Polyglot - AI Conversational Language Tutor</title>
  <link rel="icon" type="image/png" href="/logo.png" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --font-sans: 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * {
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      overscroll-behavior: none;
      -webkit-overflow-scrolling: touch;
      font-family: var(--font-sans);
      background: #f8fafc;
      color: #0f172a;
      overflow: hidden;
    }

    #root {
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    /* Safe Area Padding Helpers */
    .safe-padding-bottom {
      padding-bottom: max(1rem, env(safe-area-inset-bottom));
    }

    .safe-padding-top {
      padding-top: max(0.5rem, env(safe-area-inset-top));
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: linear-gradient(to bottom, #c7d2fe, #a5b4fc);
      border-radius: 10px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: linear-gradient(to bottom, #a5b4fc, #818cf8);
    }

    /* Selection Color */
    ::selection {
      background: #c7d2fe;
      color: #4f46e5;
    }

    /* Orb Animations & Ripple Effects */
    @keyframes orbBreath {
      0%, 100% {
        transform: scale(1) rotate(0deg);
        box-shadow: 0 0 30px rgba(99, 102, 241, 0.15), inset 0 0 15px rgba(255, 255, 255, 0.5);
      }
      50% {
        transform: scale(1.04) rotate(180deg);
        box-shadow: 0 0 45px rgba(99, 102, 241, 0.25), inset 0 0 20px rgba(255, 255, 255, 0.7);
      }
    }

    @keyframes orbSpin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes rippleTeal {
      0% {
        transform: scale(0.9);
        opacity: 0.6;
      }
      100% {
        transform: scale(1.7);
        opacity: 0;
      }
    }

    @keyframes rippleBlue {
      0% {
        transform: scale(0.9);
        opacity: 0.6;
      }
      100% {
        transform: scale(1.8);
        opacity: 0;
      }
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }

    @keyframes wave {
      0%, 100% { transform: scaleY(0.4); }
      50% { transform: scaleY(1.4); }
    }

    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .animate-orb-breath {
      animation: orbBreath 8s ease-in-out infinite;
    }

    .animate-orb-spin {
      animation: orbSpin 2s linear infinite;
    }

    .animate-float {
      animation: float 5s ease-in-out infinite;
    }

    .animate-gradient {
      background-size: 200% 200%;
      animation: gradientShift 6s ease infinite;
    }

    /* Waveform Animation Heights */
    .wave-bar-1 { animation: wave 0.8s ease-in-out infinite; }
    .wave-bar-2 { animation: wave 0.8s ease-in-out infinite 0.15s; }
    .wave-bar-3 { animation: wave 0.8s ease-in-out infinite 0.3s; }
    .wave-bar-4 { animation: wave 0.8s ease-in-out infinite 0.45s; }
    .wave-bar-5 { animation: wave 0.8s ease-in-out infinite 0.6s; }

    /* Shimmer Effect keyframes */
    @keyframes shimmer {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }
    .animate-shimmer {
      animation: shimmer 1.6s infinite linear;
    }

    /* Hide Vercel Toolbar Injections Completely */
    vercel-live-feedback, 
    #vercel-live-feedback, 
    [id*="vercel-live-feedback"],
    [class*="vercel-live-feedback"],
    iframe[src*="vercel"] {
      display: none !important;
      visibility: hidden !important;
      opacity: 0 !important;
      pointer-events: none !important;
      width: 0 !important;
      height: 0 !important;
    }

    /* Prevent text sizes from resizing automatically on mobile orientation change */
    html {
      -webkit-text-size-adjust: 100%;
    }

    /* Custom smooth transition override */
    * {
      transition: background-color 0.2s cubic-bezier(0.4, 0, 0.2, 1), border-color 0.2s cubic-bezier(0.4, 0, 0.2, 1), transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
  </style>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
